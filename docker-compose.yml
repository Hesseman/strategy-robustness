services:
  app:
    build: .
    image: strategy-robustness
    container_name: strategy-robustness
    ports:
      - "127.0.0.1:8501:8501"
  timing:
    build: .
    image: strategy-robustness
    container_name: strategy-timing
    ports:
      - "127.0.0.1:8502:8501"
    command: ["streamlit", "run", "app/timing_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
